<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuróticos Anónimos - Grupo Tranquilidad Guatemala</title>
    <!-- Tailwind CSS para el diseño rápido y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para los íconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'na-green': '#127341', // Color verde institucional aproximado
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .btn-social {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor Principal (Optimizado para Smartphone) -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden mt-4 mb-8">
        
        <!-- Encabezado con Logo -->
        <div class="bg-na-green p-6 flex justify-center items-center">
            <img src="logo grupo tranquilidad.png" alt="Logo Neuróticos Anónimos Grupo Tranquilidad" class="w-full max-w-[250px] object-contain">
        </div>

        <!-- Cuerpo de la Tarjeta -->
        <div class="p-6 text-center">
            <p class="text-gray-700 mb-8 italic">
                "Si tu vida se ha vuelto ingobernable por el miedo, la ansiedad, la ira o la depresión, hay una solución."
            </p>

            <!-- Botones de Contacto y Redes -->
            <div class="flex flex-col space-y-4">
                
                <!-- Botón de WhatsApp -->
                <a href="https://wa.me/50241501646" target="_blank" rel="noopener noreferrer" 
                   class="btn-social flex items-center justify-center w-full bg-[#25D366] text-white font-semibold py-3 px-4 rounded-xl shadow-sm text-lg">
                    <i class="fa-brands fa-whatsapp text-2xl mr-3"></i>
                    Escríbenos por WhatsApp
                </a>

                <!-- Botón de Facebook -->
                <a href="https://www.facebook.com/p/Neur%C3%B3ticos-An%C3%B3nimos-Grupo-Tranquilidad-Guatemala-100066606582483/?locale=es_LA" target="_blank" rel="noopener noreferrer" 
                   class="btn-social flex items-center justify-center w-full bg-[#1877F2] text-white font-semibold py-3 px-4 rounded-xl shadow-sm text-lg">
                    <i class="fa-brands fa-facebook text-2xl mr-3"></i>
                    Visítanos en Facebook
                </a>

                <!-- Botón de Instagram -->
                <a href="https://www.instagram.com/p/CQ2FF4WLttw/" target="_blank" rel="noopener noreferrer" 
                   class="btn-social flex items-center justify-center w-full bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white font-semibold py-3 px-4 rounded-xl shadow-sm text-lg">
                    <i class="fa-brands fa-instagram text-2xl mr-3"></i>
                    Síguenos en Instagram
                </a>

            </div>
        </div>
        
        <!-- Pie de página -->
        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-500">
                Neuróticos Anónimos - Grupo Tranquilidad Guatemala<br>
                Solo por hoy.
            </p>
        </div>
